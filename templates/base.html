<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
    <script>
        function toggleMenu() {
            const menu = document.getElementById('mobile-menu');
            menu.classList.toggle('hidden');
        }
    </script>
</head>
<body>
  <nav class="flex flex-wrap items-center justify-between py-4 px-24 bg-white shadow-md">
    <div class="flex items-center space-x-2">
        <img 
            src="https://cdn-icons-png.flaticon.com/128/3479/3479930.png" 
            alt="Book icon" 
            class="w-6 h-6 text-blue-600"
        >
        <span class="text-xl font-bold text-gray-800">LITReview</span>
    </div>

    <!-- Hamburger menu for mobile -->
    <div class="md:hidden">
        <button 
            onclick="toggleMenu()" 
            class="text-gray-600 hover:text-blue-600 focus:outline-none"
        >
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
            </svg>
        </button>
    </div>

    <!-- Navigation links -->
    <div class="hidden w-full md:flex md:w-auto md:space-x-4 md:block" id="mobile-menu">
        <div class="flex flex-col md:flex-row space-y-2 md:space-y-0 md:space-x-4">
            <a href="{%url 'flux'%}" class="text-gray-600 hover:text-blue-600 block md:inline">Flux</a>
            <a href="{%url 'posts'%}" class="text-gray-600 hover:text-blue-600 block md:inline">Posts</a>
            <a href="{%url 'follows'%}" class="text-gray-600 hover:text-blue-600 block md:inline">Abonnements</a>
            <a href="{% url 'logout' %}" class="text-gray-600 hover:text-blue-600 block md:inline">Se déconnecter</a>
        </div>
    </div>
</nav>
{% block content %} {% endblock content %}
</body>
</html>
