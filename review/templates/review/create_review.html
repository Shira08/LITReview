{% extends 'base.html' %}
{% load static %}
{% block content %}
<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    function toggleMenu() {
      const menu = document.getElementById('mobile-menu');
      menu.classList.toggle('hidden');
    }
  </script>
</head>

<body>
  <nav class="flex flex-wrap items-center justify-between py-4 px-24 bg-white shadow-md">
    <div class="flex items-center space-x-2">
      <img src="https://cdn-icons-png.flaticon.com/128/3479/3479930.png" alt="Book icon" class="w-6 h-6 text-blue-600">
      <span class="text-xl font-bold text-gray-800">LITReview</span>
    </div>

    <!-- Hamburger menu for mobile -->
    <div class="md:hidden">
      <button onclick="toggleMenu()" class="text-gray-600 hover:text-blue-600 focus:outline-none">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
        </svg>
      </button>
    </div>

    <!-- Navigation links -->
    <div class="hidden w-full md:flex md:w-auto md:space-x-4 md:block" id="mobile-menu">
      <div class="flex flex-col md:flex-row space-y-2 md:space-y-0 md:space-x-4">
        <a href="#" class="text-gray-600 hover:text-blue-600 block md:inline">Flux</a>
        <a href="#" class="text-gray-600 hover:text-blue-600 block md:inline">Posts</a>
        <a href="#" class="text-gray-600 hover:text-blue-600 block md:inline">Abonnements</a>
        <a href="{% url 'logout' %}" class="text-gray-600 hover:text-blue-600 block md:inline">Se déconnecter</a>
      </div>
    </div>
  </nav>

  <div class="px-24 bg-gray-100">

    <div class="container mx-auto px-4 py-12 max-w-3xl">
      <div class="bg-white rounded-2xl shadow-lg p-6 md:p-10">
        <div class="mb-8">
          <h2 class="text-2xl font-bold text-gray-800 flex justify-center">Créer une critique</h2>
        </div>

        <form class="" method="post" enctype="multipart/form-data">
          {% csrf_token %}

          <div class="grid grid-cols-1 md:grid-cols-2 gap-6 w-full">
            <div class="md:col-span-2 border-2 border-gray-200 p-4 rounded">
            <p class="text-1xl font-bold my-3">Détails du ticket</p>
              <!-- Titre du ticket -->
              <div class="md:col-span-2">
                <label for="firstName" class="block text-sm font-medium text-gray-700 mb-1">Titre</label>
               {{}}
              </div>

              <!-- Description ticket -->
              <div class="md:col-span-2">
                <label for="lastName" class="block text-sm font-medium text-gray-700 mb-1">Description</label>
                <textarea type="text" id="lastName"
                  class="w-full px-4 py-3 rounded-lg border border-gray-300  transition duration-150 ease-in-out"
                  placeholder="Maheshwari"></textarea>
              </div>

              <!-- Image ticket -->
              <div class="md:col-span-2">
                <label class="block text-sm font-medium text-gray-700 mb-1" for="user_avatar">Image du ticket</label>
                <input class="w-full px-4 py-3 rounded-lg border border-gray-300  transition duration-150 ease-in-out"
                  aria-describedby="user_avatar_help" type="file">
              </div>
            </div>
            <div class="md:col-span-2 border-2 border-gray-200 p-4 rounded">
              <p class="text-1xl font-bold my-3">Détails de la critique</p>

              <!-- Titre Critique -->
              <div class="md:col-span-2">
                <label for="phone" class="block text-sm font-medium text-gray-700 mb-1">Titre de la critique</label>
                <input type="text" id=""
                  class="w-full px-4 py-3 rounded-lg border border-gray-300  transition duration-150 ease-in-out"
                  placeholder="Titre de la critique">
              </div>
              <label for="rating" class="block text-sm font-medium text-gray-700 mb-1">Note </label>

              <ul
                class="items-center w-full text-sm font-medium text-gray-900 bg-white rounded-lg sm:flex  dark:text-white">

                <li class="w-full ">
                  <div class="flex items-center ps-3">
                    <input id="horizontal-list-radio-license" type="radio" value="" name="list-radio"
                      class="w-4 h-4 text-blue-600 bg-gray-100 border-gray-300">
                    <label for="horizontal-list-radio-license"
                      class="w-full py-3 ms-2 text-sm font-medium text-black">Driver License </label>
                  </div>
                </li>
                <li class="w-full ">
                  <div class="flex items-center ps-3">
                    <input id="horizontal-list-radio-license" type="radio" value="" name="list-radio"
                      class="w-4 h-4 text-blue-600 bg-gray-100 border-gray-300">
                    <label for="horizontal-list-radio-license"
                      class="w-full py-3 ms-2 text-sm font-medium text-black">Driver License </label>
                  </div>
                </li>
                <li class="w-full ">
                  <div class="flex items-center ps-3">
                    <input id="horizontal-list-radio-license" type="radio" value="" name="list-radio"
                      class="w-4 h-4 text-blue-600 bg-gray-100 border-gray-300">
                    <label for="horizontal-list-radio-license"
                      class="w-full py-3 ms-2 text-sm font-medium text-black">Driver License </label>
                  </div>
                </li>
                <li class="w-full ">
                  <div class="flex items-center ps-3">
                    <input id="horizontal-list-radio-license" type="radio" value="" name="list-radio"
                      class="w-4 h-4 text-blue-600 bg-gray-100 border-gray-300">
                    <label for="horizontal-list-radio-license"
                      class="w-full py-3 ms-2 text-sm font-medium text-black">Driver License </label>
                  </div>
                </li>
              </ul>

              <!-- Commentaire critique -->
              <div class="md:col-span-2">
                <label for="Commentaire" class="block text-sm font-medium text-gray-700 mb-1">Commentaire</label>
                <textarea type="text" id="commentaire"
                  class="w-full px-4 py-3 rounded-lg border border-gray-300  transition duration-150 ease-in-out"
                  placeholder="Commentaire"></textarea>
              </div>

            </div>

          </div>

          <!-- Submit Button -->
          <div class="mt-8">
            <button type="submit"
              class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-3 px-4 rounded-lg transition duration-150 ease-in-out shadow-md hover:shadow-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2">
              Créer une critique
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</body>

</html>
{% endblock %}
